name: Auto-Unzip & Deploy PlumbSquare to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Auto-Unzip plumbsquare-site.zip & Auto-Configure Domain URL
        run: |
          if [ -f "plumbsquare-site.zip" ]; then
            echo "Found plumbsquare-site.zip — extracting all files into repository..."
            unzip -o -q plumbsquare-site.zip -x ".github/*" -d .
            rm -f plumbsquare-site.zip
            python3 update-domain.py "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -A
            git reset -- .github/ || true
            git commit -m "Auto-extracted PlumbSquare website & configured domain URLs" || true
            git push origin HEAD:main || true
          fi
          mkdir -p _site
          rsync -a --exclude='_site' --exclude='.git' ./ _site/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
